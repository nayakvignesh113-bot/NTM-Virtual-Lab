<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Virtual laboratory for non-traditional machining processes: USM, AJM, WJM, AWJM, CHM, ECM, EDM, WEDM, LBM, EBM and PAM. Operate virtual machines, run validated simulators, take tests and print lab reports.">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>NTM Virtual Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: instrument bench — process rail on the left, bench (schematic + control panel) in the main column */
:root{
  --bg:#ECEFEE; --panel:#F9FAFA; --panel2:#DDE3E1; --ink:#14201E; --muted:#56635F; --line:#C5CECB;
  --accent:#0B6A86; --accent-ink:#FFFFFF;
  --mech:#3D5AA8; --therm:#B9440F; --chem:#2C7A4C;
  --metal:#A3AEB1; --metal2:#7E8B8F; --tool:#C79A55; --fluid:rgba(11,106,134,.20); --fluid2:rgba(11,106,134,.38);
  --spark:#E8A20C; --face:#C3CCCD; --warn:#9A5B00; --ok:#2C7A4C; --bad:#B42318;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1413; --panel:#151D1C; --panel2:#22302E; --ink:#E2E9E7; --muted:#93A29F; --line:#2B3937;
  --accent:#4BB0CC; --accent-ink:#06191F;
  --mech:#8EA6EA; --therm:#F08B4E; --chem:#6CC594;
  --metal:#56656A; --metal2:#76868B; --tool:#B98A48; --fluid:rgba(75,176,204,.16); --fluid2:rgba(75,176,204,.34);
  --spark:#FBBF24; --face:#3A4A4C; --warn:#E3A33B; --ok:#6CC594; --bad:#F97066; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1413; --panel:#151D1C; --panel2:#22302E; --ink:#E2E9E7; --muted:#93A29F; --line:#2B3937;
  --accent:#4BB0CC; --accent-ink:#06191F;
  --mech:#8EA6EA; --therm:#F08B4E; --chem:#6CC594;
  --metal:#56656A; --metal2:#76868B; --tool:#B98A48; --fluid:rgba(75,176,204,.16); --fluid2:rgba(75,176,204,.34);
  --spark:#FBBF24; --face:#3A4A4C; --warn:#E3A33B; --ok:#6CC594; --bad:#F97066; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.08}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:10px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:26px;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{font-family:var(--f-mono);font-size:12.5px;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px}
.nav a:hover{color:var(--ink);background:var(--panel2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--panel2)}

.shell{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px}
/* rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 80px);overflow:auto;padding-bottom:12px}
.rail h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:500}
.rail h4 i{width:9px;height:9px;border-radius:2px;display:inline-block}
.rail .grp{display:flex;flex-direction:column;gap:2px}
.rail button{all:unset;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:baseline;padding:6px 8px;border-radius:6px;font-size:14.5px;line-height:1.25}
.rail button b{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
.rail button:hover{background:var(--panel2)}
.rail button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.rail button[aria-current="true"] b{color:var(--bg)}
.rail button:focus-visible{outline:2px solid var(--accent)}
.rail .home{grid-template-columns:1fr;font-family:var(--f-mono);font-size:12.5px}

main{min-width:0}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(40px,5.4vw,74px);letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:60ch;color:var(--muted);margin:12px 0 0;font-size:17px}
.spec{font-family:var(--f-mono);font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;color:var(--muted)}
.spec b{color:var(--ink);font-weight:500}
.sec{margin-top:34px}
.sec>h2{font-size:30px;margin-bottom:6px}
.sec>p.lede{color:var(--muted);margin:0 0 16px;max-width:70ch}
.cls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cls-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.cls-col>header{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:2px solid var(--c)}
.cls-col>header h3{font-size:22px;color:var(--c)}
.cls-col>header span{font-size:13.5px;color:var(--muted)}
.pcard{all:unset;cursor:pointer;display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 12px;padding:12px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.pcard:hover{border-color:var(--ink)}
.pcard:focus-visible{outline:2px solid var(--accent)}
.pcard b{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--c)}
.pcard strong{font-weight:600;font-size:15px;line-height:1.25}
.pcard small{grid-column:2;color:var(--muted);font-size:13.5px;line-height:1.4}
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.other{padding:14px;border-top:1px solid var(--line)}
.other b{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.other h3{font-size:19px;margin:2px 0 4px}
.other p{margin:0;font-size:14.5px;color:var(--muted)}

/* process */
.phead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end}
.phead .abbr{font-family:var(--f-display);font-size:clamp(52px,7vw,80px);line-height:.86;color:var(--c);grid-row:span 2}
.phead h1{font-size:clamp(24px,3vw,34px)}
.phead p{margin:0;color:var(--muted);max-width:70ch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.facts div:first-child{border-left:0;padding-left:0}
.facts dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:14.5px;line-height:1.35}
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-family:var(--f-mono);font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--c)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.pane{padding-top:18px}

.bench{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:20px;align-items:start}
.scope{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.scope-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;flex-wrap:wrap}
.scope canvas{display:block;width:100%;aspect-ratio:16/10;max-width:100%}
.iconbtn{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;color:var(--ink)}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.read{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-top:1px solid var(--line)}
.read div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.read dt{font-size:12.5px;color:var(--muted);line-height:1.25}
.read dd{margin:3px 0 0;font-family:var(--f-mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read dd small{font-size:11.5px;color:var(--muted);margin-left:4px;font-weight:400}
.read div.pri dd{color:var(--c)}
.notes{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.notes:empty{display:none}
.note{font-size:13.5px;display:flex;gap:8px;align-items:baseline;color:var(--warn)}
.note::before{content:"!";font-family:var(--f-mono);font-weight:600;font-size:11px;width:16px;height:16px;flex:none;border:1.5px solid currentColor;border-radius:50%;display:inline-grid;place-items:center;transform:translateY(2px)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel>h3{font-size:19px}
.ctrl{display:flex;flex-direction:column;gap:4px}
.ctrl .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ctrl label{font-size:14px;line-height:1.3}
.ctrl output{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl output small{color:var(--muted)}
.ctrl input[type=range]{width:100%;accent-color:var(--c);margin:2px 0}
.ctrl select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.ctrl .rng{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:6px;font-weight:600;font-size:14px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{opacity:.88}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.card .sel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.card .sel select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13.5px;max-width:100%}
.chart{width:100%;aspect-ratio:16/9;display:block}
.tablewrap{overflow-x:auto;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--muted);background:var(--panel);position:sticky;top:0;text-align:right}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-mono)}
.empty{color:var(--muted);font-size:14px;padding:14px}
.proc{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.aim{font-size:15.5px;margin:0 0 10px}

/* theory */
.theory{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.prose p{margin:0 0 12px;max-width:68ch}
.prose h3{font-size:22px;margin:22px 0 8px}
.prose h3:first-child{margin-top:0}
.eq{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;overflow-x:auto}
.eq .f{font-family:var(--f-mono);font-size:15px;white-space:nowrap}
.eq .w{font-size:13.5px;color:var(--muted);margin-top:4px}
.eq var{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-size:16px}
ul.ticks{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:15px}
.side h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:500}
.side h4:first-child{margin-top:0}
.model{border-top:1px solid var(--line);margin-top:22px;padding-top:14px;font-size:14.5px;color:var(--muted)}
.model b{color:var(--ink)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px;max-width:780px}
.q{padding-bottom:16px;border-bottom:1px solid var(--line)}
.q p{margin:0 0 8px;font-weight:600}
.q .opts{display:flex;flex-direction:column;gap:6px}
.q .opts button{all:unset;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:15px;background:var(--panel)}
.q .opts button:hover{border-color:var(--ink)}
.q .opts button:focus-visible{outline:2px solid var(--accent)}
.q .opts button.right{border-color:var(--ok);color:var(--ok);font-weight:600}
.q .opts button.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.q .why{margin-top:8px;font-size:14px;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* compare */
.cmp td,.cmp th{text-align:left;white-space:normal;vertical-align:top}
.cmp td{font-family:var(--f-body);font-size:14px}
.cmp td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.cmp th.n{text-align:right}
.cmp .tag{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.foot{font-size:13.5px;color:var(--muted);margin-top:10px;max-width:80ch}

@media (max-width:1100px){ .bench{grid-template-columns:minmax(0,1fr)} .lower{grid-template-columns:minmax(0,1fr)} .theory{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;max-height:none;flex-direction:row;overflow-x:auto;gap:14px;padding-bottom:6px}
  .rail .grp{flex-direction:row;gap:4px}
  .rail h4{display:none}
  .rail button{grid-template-columns:auto;white-space:nowrap;padding:6px 10px;border:1px solid var(--line)}
  .rail button span{display:none}
  .rail button b{font-size:12.5px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .phead{grid-template-columns:minmax(0,1fr)} .phead .abbr{grid-row:auto;font-size:52px}
  .cls{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(3){border-left:0;padding-left:0}
  .facts div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:480px){ .read{grid-template-columns:repeat(2,minmax(0,1fr))} .read dd{font-size:16px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }

/* v2 additions */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cc);border:1px solid var(--cc);border-radius:999px;padding:2px 8px;white-space:nowrap;line-height:1.5;vertical-align:middle}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}
.pc-st{grid-column:2;margin-top:2px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs .tn{font-size:10px;color:var(--muted);margin-right:6px}
.valhead{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-bottom:16px;max-width:80ch}
.valhead p{margin:0}
.valhead .big{font-size:18px}
.valhead .big b{font-family:var(--f-mono);color:var(--c)}
.valgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;margin-bottom:16px}
.vcard h3{font-size:17px;margin:0}
.vtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.vstat{font-size:13.5px;color:var(--muted);margin-top:6px}
.vstat b{font-family:var(--f-mono);color:var(--ink)}
details{margin-top:8px}
details summary{cursor:pointer;font-size:13.5px;color:var(--accent)}
.card+.card,.finding+.card{margin-top:16px}
.finding{border-top:2px solid var(--c);padding:12px 0;margin:16px 0;max-width:80ch;font-size:15px}
.mydata{margin-top:16px}
.mygrid{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
.mygrid textarea{width:100%;font-family:var(--f-mono);font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend:empty{display:none}
.legend i{display:inline-block;width:18px;border-top:2px dashed;vertical-align:middle;margin-right:6px}
.numcard{max-width:760px}
.numq{font-size:16.5px;margin:0 0 12px;font-weight:400}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--f-mono)}
.btn[disabled]{opacity:.4;cursor:default}
.repform{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.repform .wide{grid-column:1/-1}
.repform input,.repform textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;max-width:900px}
.sheet h3{font-size:19px;margin:18px 0 6px}
.sheet p{margin:0 0 8px;max-width:75ch}
.sheet ol{margin:0;padding-left:20px}
.sh-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.sh-head h2{font-size:28px;margin-top:4px}
.sh-meta{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:13.5px;margin:0}
.sh-meta dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;align-self:center}
.sh-meta dd{margin:0}
.sh-img{width:100%;max-width:720px;border:1px solid var(--line);border-radius:6px}
@media (max-width:640px){.mygrid{grid-template-columns:minmax(0,1fr)}}
@media print{
  :root{--bg:#fff;--panel:#fff;--ink:#000;--muted:#444;--line:#bbb}
  body{background:#fff;color:#000}
  .top,.rail,.phead,.facts,.tabs,.no-print{display:none!important}
  .shell{display:block;padding:0;max-width:none}
  .sheet{border:0;padding:0;max-width:none}
  .tablewrap{overflow:visible;max-height:none;border:0}
  th{position:static}
  .sh-img{max-width:560px}
  .sheet table{font-size:9.5px}
  .sheet th,.sheet td{white-space:normal;padding:3px 4px}
  .sheet th{font-size:8.5px}
  h3{break-after:avoid}
}

/* operate */
.console{gap:16px}
.tray,.switches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.part{all:unset;cursor:grab;touch-action:none;user-select:none;padding:8px 12px;border:1.5px dashed var(--accent);border-radius:6px;font-size:14px;font-weight:600;color:var(--accent);background:var(--bg)}
.part:hover{background:var(--panel2)}
.part.placed{border-style:solid;border-color:var(--line);color:var(--muted);cursor:default;font-weight:400}
.part:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);padding:8px 12px;border:1.5px solid var(--accent);border-radius:6px;background:var(--panel);color:var(--accent);font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.switches{flex-direction:column;flex-wrap:nowrap}
.sw{all:unset;cursor:pointer;display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:14px}
.sw b{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sw .led{width:10px;height:10px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 1px var(--muted)}
.sw.on{border-color:var(--ok)}.sw.on .led{background:var(--ok);box-shadow:0 0 6px var(--ok)}.sw.on b{color:var(--ok)}
.sw.ramp .led{background:var(--warn);animation:blink .6s steps(2) infinite}
.sw[disabled]{opacity:.55;cursor:default}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.sw.ramp .led{animation:none}}
.estop{color:var(--bad)!important;border-color:var(--bad)!important;font-weight:600}
.estop[disabled]{opacity:.4}
.cyc p{margin:4px 0 8px;font-size:14px}
.pbar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;width:0;background:var(--c)}
.small{font-size:12px;color:var(--muted);margin-top:6px}
.alarm{margin:0;padding:10px 12px;border-top:2px solid var(--bad);color:var(--bad);font-size:14px;background:var(--panel)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px;font-size:15px}
.steps li.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.steps li.done::marker{color:var(--ok)}
.steps li.act{font-weight:600}
.steps li.act::marker{color:var(--c)}
#ocv{display:block;width:100%;aspect-ratio:16/10;max-width:100%;touch-action:none}
</style>

<script>
// ---------- shared physical data ----------
const FARADAY = 96485;
// Thermal property sets: rho kg/m3, c J/kgK, Tm K, Lm J/kg, Tb K, Lv J/kg, alpha m2/s
const TH = {
  steel:   {name:'Tool / mild steel', rho:7850, c:470, Tm:1800, Lm:2.7e5, Tb:3134, Lv:6.09e6, a:1.2e-5},
  ss:      {name:'Stainless steel 304', rho:8000, c:500, Tm:1720, Lm:2.7e5, Tb:3100, Lv:6.1e6, a:4.0e-6},
  ti:      {name:'Ti-6Al-4V', rho:4430, c:560, Tm:1933, Lm:2.9e5, Tb:3560, Lv:8.88e6, a:2.9e-6},
  inco:    {name:'Inconel 718', rho:8190, c:435, Tm:1609, Lm:2.27e5, Tb:3186, Lv:6.3e6, a:3.1e-6},
  al:      {name:'Al 6061', rho:2700, c:900, Tm:925, Lm:3.97e5, Tb:2743, Lv:1.05e7, a:6.4e-5},
  wc:      {name:'WC-Co (cemented carbide)', rho:14500, c:200, Tm:3058, Lm:3.3e5, Tb:6000, Lv:4.0e6, a:3.0e-5},
  ni:      {name:'Nickel superalloy', rho:8900, c:444, Tm:1728, Lm:2.98e5, Tb:3186, Lv:6.3e6, a:3.5e-6},
  w:       {name:'Tungsten', rho:19300, c:134, Tm:3695, Lm:1.92e5, Tb:5828, Lv:4.38e6, a:6.6e-5},
};
// energy to melt (J/mm3) and to vaporise (J/mm3) from room temperature
const eMelt = m => m.rho*(m.c*(m.Tm-298)+m.Lm)*1e-9;
const eVap  = m => m.rho*(m.c*(m.Tb-298)+m.Lm+m.Lv)*1e-9;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

// ---------- process definitions ----------
const PROCESSES = [
/* ======================= USM ======================= */
{
 id:'usm', abbr:'USM', name:'Ultrasonic Machining', cat:'mech',
 blurb:'A tool vibrating at about 20 kHz hammers abrasive grains into hard, brittle work.',
 facts:{energy:'Mechanical (ultrasonic vibration)', mech:'Brittle micro-chipping by impacting grits', medium:'Abrasive slurry (B₄C, SiC, Al₂O₃ in water)', tool:'Soft steel, brass, monel; shaped like the cavity'},
 aim:'To study the effect of vibration amplitude, static feed force, grit size and slurry concentration on the material removal rate (MRR) and penetration rate in ultrasonic machining of brittle materials.',
 params:[
  {id:'A0',label:'Vibration amplitude A₀',unit:'µm',min:10,max:60,step:1,val:25},
  {id:'f',label:'Frequency f',unit:'kHz',min:18,max:40,step:0.5,val:20},
  {id:'F',label:'Static feed force F',unit:'N',min:5,max:80,step:1,val:20},
  {id:'d',label:'Mean grit diameter d',unit:'µm',min:10,max:150,step:1,val:50},
  {id:'C',label:'Slurry concentration C',unit:'% vol',min:10,max:60,step:1,val:30},
  {id:'area',label:'Tool face area',unit:'mm²',min:10,max:200,step:1,val:80},
  {id:'mat',label:'Work material',type:'select',val:'glass',options:[['glass','Soda-lime glass (index 100)'],['brass','Brass (6.6)'],['w','Tungsten (4.8)'],['ti','Titanium (4.0)'],['steel','Steel (3.9)']]},
 ],
 mats:{glass:100,brass:6.6,w:4.8,ti:4.0,steel:3.9},
 outputs:[
  {k:'mrr',label:'MRR',unit:'mm³/min',pri:1},
  {k:'pen',label:'Penetration rate',unit:'mm/min'},
  {k:'h',label:'Grit indentation depth',unit:'µm'},
  {k:'Ng',label:'Active grits under tool',unit:''},
  {k:'Ra',label:'Surface roughness Ra (est.)',unit:'µm'},
  {k:'t5',label:'Time to sink 5 mm',unit:'min'},
 ],
 sweep:{x:'F',y:'mrr'},
 compute(p){
  const R=this.mats[p.mat];
  const A=p.area*1e-6, d=p.d*1e-6, A0=p.A0*1e-6, f=p.f*1e3, C=p.C/100;
  const Ng=C*0.25*A/(Math.PI*d*d/4);
  const H=5.5e9;
  const h=Math.sqrt(8*p.F*A0/(Math.PI*H*Ng*d));
  const Vg=2/3*Math.PI*Math.pow(d*h,1.5);
  const Fc=0.6*p.area, crush=1/(1+Math.pow(p.F/Fc,3));
  const mrr=0.05*Ng*Vg*f*(R/100)*crush*1e9*60;
  const pen=mrr/p.area;
  const notes=[];
  if(p.F>0.8*Fc) notes.push(`Static force is near or above the grit-crushing limit (~${(0.69*Fc).toFixed(0)} N for this tool area). Grains fracture before they cut, so MRR falls.`);
  if(p.d>p.A0*3) notes.push('Grit is much larger than the amplitude. Grains may not be re-circulated under the tool efficiently.');
  if(R<10) notes.push('Ductile metals deform instead of chipping, so USM is rarely economical on them.');
  return {o:{mrr,pen,h:h*1e6,Ng:Math.round(Ng),Ra:0.012*p.d,t5:5/pen},notes};
 },
 theory:{
  principle:[
   'A piezoelectric or magnetostrictive transducer turns high-frequency electrical power (19–25 kHz) into longitudinal vibration. A tapered horn (concentrator) amplifies this to an amplitude of roughly 10–50 µm at the tool face.',
   'Abrasive slurry is pumped into the gap. On every downstroke the tool drives grains into the work. In hard, brittle materials each impact creates a tiny Hertzian crack field and a chip breaks away. The tool is fed down under a small static force, so the cavity takes the shape of the tool plus an overcut of about one grit size.',
   'The tool itself is made of a tough, ductile metal. It wears, but far more slowly than the brittle workpiece, because the same impacts only dent it plastically.'
  ],
  eq:[
   {f:'<var>h</var><sub>w</sub> = √( 8<var>F</var><var>A</var><sub>0</sub> / (π<var>H</var><var>N</var><sub>g</sub><var>d</var>) )',w:'Shaw\'s impact model: the static feed force F equals the time-average of the short impulsive grit forces (σπ·d·h per grit, acting for a fraction ≈ h/4A₀ of each cycle). N_g grits of diameter d indent a surface of hardness H by h_w.'},
   {f:'<var>V</var><sub>g</sub> = ⅔ π (<var>d</var>·<var>h</var><sub>w</sub>)<sup>3/2</sup>',w:'Volume of the hemispherical chip under one grit (crater radius ≈ √(d·h_w)).'},
   {f:'MRR = κ · <var>N</var><sub>g</sub> · <var>V</var><sub>g</sub> · <var>f</var>  ⇒  MRR ∝ <var>A</var><sub>0</sub><sup>3/4</sup> <var>F</var><sup>3/4</sup> <var>C</var><sup>1/4</sup>',w:'κ is the fraction of grits that actually impact per cycle. The exponents are the classical trends of Shaw\'s model.'},
  ],
  effects:['Higher amplitude raises MRR as A₀^¾; it is the strongest lever after frequency.','MRR rises with feed force, peaks, then falls once grains begin to crush.','Concentration has a weak effect (C^¼); above ~30–40 % the gain is small.','Finer grit gives a better finish (Ra scales with grit size) but lower MRR.','Brittle materials (glass, ceramics, germanium, ferrite) machine 10–25× faster than metals.'],
  apps:['Holes and cavities in glass, ceramics, quartz and ferrites','Dies and wire-drawing nozzles in WC','Coining-type shaped cavities and fine slots','Drilling of gemstones and silicon'],
  adv:['Machines non-conductive, hard, brittle materials','No thermal damage or residual tensile stress','Good finish and accuracy; burr-free'],
  lim:['Low MRR, especially on ductile metals','Tool wear needs frequent tool replacement for accurate work','Hole depth limited by slurry circulation (taper in deep holes)'],
  model:'<b>Simulator model.</b> Shaw\'s impact model with κ = 0.05, calibrated so that glass gives about 2 mm/min penetration (≈190 mm³/min with an 80 mm² tool) at 20 kHz and 25 µm. Active grits N_g = 0.25·C·A/(πd²/4). Other materials are scaled with the relative USM machinability index (glass = 100, Ghosh & Mallik). Grit crushing is a simple empirical penalty 1/(1+(F/F_c)³) with F_c = 0.6 N per mm² of tool area. Ra ≈ 0.012·d is a rule of thumb. Treat outputs as trend estimates.'
 },
 procedure:['Select the work material and fix the tool area.','Set amplitude 25 µm, frequency 20 kHz, grit 50 µm and 30 % slurry.','Vary the static force from 5 N to 80 N in steps and record MRR at each step.','Plot MRR against force and identify the optimum force.','Repeat with amplitude 15 µm and 40 µm and compare the curves.','Change grit size and note the trade-off between MRR and Ra.'],
 quiz:[
  {q:'In ultrasonic machining, material is removed mainly by…',o:['Melting and vaporisation','Micro-chipping of brittle work by hammered abrasive grains','Anodic dissolution','Chemical reaction with the slurry'],a:1,why:'The tool never touches the work. It drives grains into the surface, which fractures brittle material in tiny chips.'},
  {q:'A typical USM operating frequency is…',o:['50–60 Hz','19–25 kHz','200–300 kHz','1–2 MHz'],a:1,why:'Just above the audible range, around 20 kHz, where transducers and horns can deliver large amplitudes.'},
  {q:'By Shaw\'s analysis, how does MRR vary with vibration amplitude A₀?',o:['Independent of A₀','∝ A₀²','∝ A₀^(3/4)','∝ 1/A₀'],a:2,why:'Indentation depth grows with √(F·A₀), and chip volume with (d·h)^1.5, giving A₀^(3/4).'},
  {q:'Which work material is least suited to USM?',o:['Glass','Alumina ceramic','Annealed mild steel','Germanium'],a:2,why:'Ductile metals absorb impacts plastically rather than chipping; their relative removal rate is only a few percent of glass.'},
  {q:'Why is the USM tool made of a tough, ductile metal rather than a hard one?',o:['To conduct the current','So it deforms plastically and wears slowly while brittle work chips','To make it magnetic','To absorb slurry'],a:1,why:'A ductile tool survives the repeated impacts; a hard brittle tool would chip just like the workpiece.'},
 ]
},
/* ======================= AJM ======================= */
{
 id:'ajm', abbr:'AJM', name:'Abrasive Jet Machining', cat:'mech',
 blurb:'A high-speed stream of fine abrasive in dry gas erodes brittle and heat-sensitive material.',
 facts:{energy:'Mechanical (kinetic energy of particles)', mech:'Erosion by micro-cutting and brittle fracture', medium:'Dry air, N₂ or CO₂ carrying 10–50 µm grit', tool:'WC or sapphire nozzle, 0.2–1.0 mm bore'},
 aim:'To study how nozzle pressure, abrasive flow rate, grit size and stand-off distance (SOD) affect MRR and kerf width in abrasive jet machining.',
 params:[
  {id:'p',label:'Nozzle pressure',unit:'bar',min:2,max:10,step:0.1,val:6},
  {id:'ma',label:'Abrasive flow rate',unit:'g/min',min:2,max:20,step:0.5,val:8},
  {id:'d',label:'Grit diameter',unit:'µm',min:10,max:60,step:1,val:25},
  {id:'sod',label:'Stand-off distance',unit:'mm',min:0.5,max:15,step:0.1,val:1},
  {id:'dn',label:'Nozzle bore',unit:'mm',min:0.2,max:1.0,step:0.05,val:0.45},
  {id:'ab',label:'Abrasive',type:'select',val:'al2o3',options:[['al2o3','Aluminium oxide (ρ 3.95 g/cc)'],['sic','Silicon carbide (ρ 3.21 g/cc)'],['glass','Glass beads (ρ 2.50 g/cc)']]},
  {id:'mat',label:'Work material',type:'select',val:'glass',options:[['glass','Glass (H ≈ 5.5 GPa)'],['si','Silicon (H ≈ 10 GPa)'],['quartz','Quartz (H ≈ 11 GPa)'],['alumina','Alumina ceramic (H ≈ 15 GPa)']]},
 ],
 abr:{al2o3:3950,sic:3210,glass:2500}, hard:{glass:5.5e9,si:10e9,quartz:11e9,alumina:15e9},
 outputs:[
  {k:'mrr',label:'MRR',unit:'mm³/min',pri:1},
  {k:'v',label:'Particle velocity',unit:'m/s'},
  {k:'N',label:'Particle flux',unit:'×10⁶ /s'},
  {k:'ke',label:'KE per particle',unit:'µJ'},
  {k:'kerf',label:'Kerf width at work',unit:'mm'},
  {k:'g',label:'SOD efficiency',unit:'%'},
 ],
 sweep:{x:'sod',y:'mrr'},
 compute(p){
  const rho=this.abr[p.ab], H=this.hard[p.mat], d=p.d*1e-6;
  const v=300*Math.sqrt(p.p/10)*(1-0.015*p.ma);
  const mp=rho*Math.PI/6*d*d*d;
  const N=(p.ma/1000/60)/mp;
  const g=Math.exp(-Math.pow(Math.log(p.sod/0.8),2)/(2*1.4*1.4));
  const mrr=0.25*N*d*d*d*Math.pow(v,1.5)*Math.pow(rho/(12*H),0.75)*g*1e9*60;
  const kerf=p.dn+2*p.sod*Math.tan(7*Math.PI/180);
  const notes=[];
  if(p.sod>6) notes.push('Large SOD: the jet has spread and slowed, so MRR drops and the kerf widens with a rounded edge.');
  if(p.ma>15) notes.push('High abrasive loading reduces gas velocity per particle; gains in MRR flatten.');
  if(p.sod<0.6) notes.push('Very small SOD: rebounding grit interferes with incoming grit and the nozzle wears quickly.');
  return {o:{mrr,v,N:N/1e6,ke:0.5*mp*v*v*1e6,kerf,g:g*100},notes};
 },
 theory:{
  principle:[
   'Dry gas at 2–10 bar is mixed with fine abrasive in a mixing chamber (a vibrator meters the powder) and expanded through a small nozzle. Particles leave at roughly 150–300 m/s.',
   'Each particle striking a brittle surface creates a small crater by fracture; on ductile surfaces it cuts or ploughs. The jet diverges slightly (about 7° half-angle), so the cut width grows with stand-off distance.',
   'AJM differs from sand blasting: grit is much finer (10–50 µm), the jet is small and controlled, and the aim is shaping rather than surface cleaning.'
  ],
  eq:[
   {f:'MRR = <var>x</var> · <var>N</var> · <var>d</var><sup>3</sup> · <var>v</var><sup>3/2</sup> · ( ρ<sub>a</sub> / 12<var>H</var><sub>w</sub> )<sup>3/4</sup>',w:'Brittle-fracture erosion model (Sarkar & Pandey form): N particles per second of diameter d, density ρₐ and velocity v striking a surface of hardness H_w.'},
   {f:'<var>N</var> = ṁ<sub>a</sub> / ( ρ<sub>a</sub> π<var>d</var><sup>3</sup>/6 )',w:'Particle flux from abrasive mass flow rate.'},
   {f:'<var>w</var> ≈ <var>d</var><sub>n</sub> + 2·SOD·tan 7°',w:'Approximate kerf width from nozzle bore and jet divergence.'},
  ],
  effects:['MRR grows with v^1.5, so pressure is the dominant control.','MRR rises with abrasive flow, then saturates as the gas cannot accelerate more grit.','MRR peaks at a small SOD (≈ 0.75–1 mm) and falls at larger SOD.','Larger grit removes more per impact but gives a rougher surface.','Harder work (alumina) erodes more slowly than glass.'],
  apps:['Frosting, deburring and cutting of glass and ceramics','Drilling and slotting of thin, fragile or heat-sensitive parts','Cleaning and etching of semiconductors and micro-channels','Removing coatings and flash'],
  adv:['No heat, no chemical change, no tool contact','Cuts brittle and heat-sensitive materials','Low capital cost'],
  lim:['Low MRR','Stray cutting and tapered walls','Abrasive cannot be reused; dust needs extraction','Not suitable for soft ductile metals'],
  model:'<b>Simulator model.</b> Particle velocity is an empirical fit v = 300·√(p/10)·(1 − 0.015·ṁₐ) m/s. MRR uses the brittle-erosion expression above with x = 0.25. The SOD factor is a log-normal curve centred at 0.8 mm. Constants were chosen to reproduce the commonly quoted order of magnitude (≈1–15 mm³/min on glass).'
 },
 procedure:['Choose Al₂O₃ grit and glass work.','Set pressure 6 bar, flow 8 g/min, grit 25 µm.','Vary SOD from 0.5 mm to 15 mm and record MRR and kerf width.','Plot MRR vs SOD and identify the optimum SOD.','Repeat at 4 bar and 8 bar; comment on the effect of pressure.'],
 quiz:[
  {q:'Which gas must NOT be used as the AJM carrier gas?',o:['Air','Nitrogen','Carbon dioxide','Oxygen'],a:3,why:'Oxygen with fine, energetic dust is a fire and explosion hazard.'},
  {q:'Why is abrasive generally not reused in AJM?',o:['It becomes magnetic','Grains lose their sharp edges and are contaminated','It dissolves','It is too expensive to recover'],a:1,why:'Used grit is blunted and mixed with debris, so cutting ability and consistency drop.'},
  {q:'A typical AJM nozzle is made of…',o:['Mild steel','Copper','Tungsten carbide or sapphire','PTFE'],a:2,why:'The nozzle bore is itself eroded by the jet, so very hard materials are used.'},
  {q:'Increasing stand-off distance well beyond the optimum will…',o:['Increase MRR and narrow the kerf','Reduce MRR and widen the kerf','Have no effect','Increase particle velocity'],a:1,why:'The jet spreads and loses speed, spreading fewer, slower impacts over a wider area.'},
 ]
},
/* ======================= WJM ======================= */
{
 id:'wjm', abbr:'WJM', name:'Water Jet Machining', cat:'mech',
 blurb:'Water at up to 400 MPa through a jewel orifice slices soft and fibrous non-metals.',
 facts:{energy:'Mechanical (hydraulic pressure → jet kinetic energy)', mech:'Erosion and shearing by a coherent high-velocity jet', medium:'Water (often with long-chain polymer additive)', tool:'Sapphire, ruby or diamond orifice, 0.08–0.4 mm'},
 aim:'To determine jet velocity, flow rate, hydraulic power and the maximum separation speed achievable in pure water-jet cutting of soft materials.',
 params:[
  {id:'p',label:'Pump pressure',unit:'MPa',min:100,max:400,step:5,val:300},
  {id:'dn',label:'Orifice diameter',unit:'mm',min:0.08,max:0.4,step:0.01,val:0.2},
  {id:'t',label:'Material thickness',unit:'mm',min:1,max:100,step:1,val:10},
  {id:'mat',label:'Work material',type:'select',val:'rubber',options:[['foam','Polyurethane foam'],['card','Corrugated board'],['leather','Leather'],['rubber','Rubber sheet'],['abs','ABS plastic'],['ply','Plywood']]},
 ],
 es:{foam:1.15,card:12.8,leather:38,rubber:58,abs:230,ply:231},
 outputs:[
  {k:'u',label:'Max separation speed',unit:'mm/min',pri:1},
  {k:'v',label:'Jet velocity',unit:'m/s'},
  {k:'Q',label:'Water flow',unit:'L/min'},
  {k:'P',label:'Hydraulic power',unit:'kW'},
  {k:'Fj',label:'Jet thrust',unit:'N'},
  {k:'kerf',label:'Kerf width',unit:'mm'},
 ],
 sweep:{x:'p',y:'u'},
 compute(p){
  const rho=1000, A=Math.PI/4*Math.pow(p.dn*1e-3,2);
  const vth=Math.sqrt(2*p.p*1e6/rho);
  const v=0.95*vth, Q=0.70*A*vth;
  const P=p.p*1e6*Q;
  const kerf=1.1*p.dn+0.03;
  const u=P/(p.t*kerf*this.es[p.mat])*60;
  const notes=[];
  if(p.mat==='ply'||p.mat==='abs') if(u<300) notes.push('Rigid, dense materials cut slowly with pure water. Abrasive water jet is usually chosen instead.');
  if(p.t>50) notes.push('Thick sections: jet coherence falls with depth, so real speeds drop faster than this linear model predicts.');
  return {o:{u,v,Q:Q*60000,P:P/1000,Fj:rho*Q*v,kerf},notes};
 },
 theory:{
  principle:[
   'An intensifier pump raises tap water to 200–400 MPa (some systems 600 MPa). The water passes through a tiny jewel orifice where pressure energy becomes velocity: at 400 MPa the jet leaves at close to 900 m/s.',
   'The jet acts like a moving saw. Where its stagnation pressure exceeds the material\'s strength it erodes and shears a narrow kerf. Long-chain polymers are often added to keep the jet coherent over a longer distance.',
   'Pure water jets suit soft, fibrous or layered materials such as foam, rubber, food, paper, textiles and thin plastics. For metals, glass and stone, abrasive is added (see AWJM).'
  ],
  eq:[
   {f:'<var>v</var> = <var>C</var><sub>v</sub> √( 2<var>p</var> / ρ )',w:'Bernoulli jet velocity; C_v ≈ 0.95 for a sapphire orifice (compressibility neglected).'},
   {f:'<var>Q</var> = <var>C</var><sub>d</sub> · (π<var>d</var><sub>o</sub><sup>2</sup>/4) · √( 2<var>p</var> / ρ ),   <var>C</var><sub>d</sub> ≈ 0.7',w:'Volume flow through the orifice including vena-contracta losses.'},

{
 id:'awjm', abbr:'AWJM', name:'Abrasive Water Jet Machining', cat:'mech',
 blurb:'Garnet entrained into a water jet cuts metals, stone, glass and composites without heat.',

 params:[
  {id:'p',label:'Pump pressure',unit:'MPa',min:150,max:600,step:5,val:380},

 ],
 nm:{al:215,steel:87,ss:81,ti:115,glass:480,granite:340},
 outputs:[
  {k:'u',label:'Max separation speed',unit:'mm/min',pri:1},
  {k:'uq',label:'Quality-5 finish speed (Q1 ÷ 5.8)',unit:'mm/min'},
  {k:'vw',label:'Water jet velocity',unit:'m/s'},
  {k:'va',label:'Abrasive velocity',unit:'m/s'},
  {k:'R',label:'Loading ratio ṁₐ/ṁ_w',unit:''},
  {k:'Pa',label:'Effective abrasive power',unit:'kW'},
  {k:'Q',label:'Water flow',unit:'L/min'},
  {k:'kerf',label:'Kerf (top)',unit:'mm'},
 ],
 sweep:{x:'ma',y:'u'},
 compute(p){
  const rho=1000, A=Math.PI/4*Math.pow(p.dn*1e-3,2), vth=Math.sqrt(2*p.p*1e6/rho);
  const vw=0.95*vth, mw=rho*0.70*A*vth, ma=p.ma/60;
  const R=ma/mw, va=0.8*vw/(1+R);
  const frag=Math.exp(-R/0.35);
  const Pa=0.5*ma*va*va*frag;
  const es=3220/this.nm[p.mat];
  const kerf=p.dm+0.1;
  const u=Pa/(p.t*kerf*es)*60;
  const notes=[];
  if(p.dm<2.5*p.dn) notes.push('Focusing tube is less than ~2.5× the orifice size. Real systems use a ratio of about 3 to avoid tube blockage and rapid wear.');
  if(R>0.35) notes.push('Very high loading ratio: particles collide and fragment in the tube, so extra garnet adds little.');
  if(R<0.06) notes.push('Lean abrasive loading: much of the jet energy stays in the water.');
  return {o:{u,uq:u/5.8,vw,va,R,Pa:Pa/1000,Q:mw*60,kerf},notes};
 },
 theory:{
  principle:[
   'A pure water jet is formed in a jewel orifice, then passes through a mixing chamber. The low pressure created by the jet draws in dry garnet from a hopper (venturi effect). In the focusing tube, 60–100 mm long, the water accelerates the abrasive to several hundred m/s.',
   'The abrasive particles, not the water, do the cutting. Momentum transfer is imperfect: abrasive velocity is about 0.7–0.85 of the water velocity, further reduced as the abrasive loading increases.',
   'As the jet penetrates, it loses energy and lags behind, leaving curved striation marks and a slight taper on the lower part of the cut. Slower traverse gives a smoother, squarer edge.'
  ],
  eq:[
   {f:'<var>v</var><sub>a</sub> = η<sub>m</sub> · <var>v</var><sub>w</sub> / (1 + <var>R</var>),   <var>R</var> = ṁ<sub>a</sub> / ṁ<sub>w</sub>',w:'Momentum balance in the focusing tube; η_m ≈ 0.8 is the momentum transfer efficiency.'},
   {f:'<var>P</var><sub>a</sub> = ½ ṁ<sub>a</sub> <var>v</var><sub>a</sub><sup>2</sup> · e<sup>−R/0.35</sup>',w:'Kinetic power carried by the abrasive, with an empirical fragmentation penalty.'},
   {f:'<var>u</var><sub>max</sub> = <var>P</var><sub>a</sub> / ( <var>t</var> · <var>w</var> · <var>e</var><sub>s</sub> ),   <var>e</var><sub>s</sub> ∝ 1/<var>N</var><sub>m</sub>',w:'Separation speed from an energy balance; N_m is the Zeng–Kim machinability number.'},
  ],
  effects:['Cutting speed rises steeply with pressure (≈ p^1.5).','Speed increases with abrasive flow, then flattens beyond a loading ratio of about 0.2–0.3.','Thicker plate: speed falls, taper and striations increase.','An excellent (Quality-5) edge needs about 1/6 of the separation (Quality-1) speed; WARDJET reports a 5.8× ratio for 100 mm aluminium.'],
  apps:['Profile cutting of steel, titanium, Inconel and armour plate','Glass, stone and tile (including laminated glass)','Composites (CFRP, GFRP) without delamination from heat','Aerospace parts where a heat-affected zone is not allowed'],
  adv:['No HAZ; cuts almost any material','Thick sections (100+ mm) in one pass','Low cutting forces, simple fixturing'],
  lim:['Taper and striations on thick parts','Garnet consumption and disposal','Focusing tube and orifice wear','Not suited to very precise small features'],
  model:'<b>Simulator model.</b> Hydraulics as in WJM. Momentum transfer efficiency 0.8. Effective specific energy e_s = 3220 / N_m (J/mm³), calibrated so that 380 MPa, 0.33 mm orifice, 1.0 mm tube and 0.4 kg/min garnet separate 25 mm mild steel at about 50 mm/min. Machinability numbers are indicative values in the Zeng–Kim style.'
 },
 procedure:['Select mild steel, 25 mm thick.','Set pressure 380 MPa, orifice 0.33 mm, tube 1.0 mm.','Vary garnet flow from 0.05 to 1.2 kg/min and record separation speed and loading ratio.','Plot speed vs abrasive flow; identify where it saturates.','Repeat for aluminium and granite and compare.'],
 quiz:[
  {q:'In AWJM the abrasive is introduced…',o:['Into the pump inlet','In the mixing chamber after the orifice','Directly into the workpiece','Into the catcher tank'],a:1,why:'Abrasive is entrained downstream of the orifice; putting it upstream would destroy the pump and orifice.'},

{

 blurb:'Controlled dissolution by an etchant through openings in a protective maskant.',
 facts:{energy:'Chemical', mech:'Dissolution by chemical reaction (isotropic etching)', medium:'Etchant: NaOH, FeCl₃, HF–HNO₃ etc.', tool:'Maskant (neoprene, vinyl, photoresist) defines the area'},

 sys:{al:{r:0.018,E:1.4,Ea:45000},steel:{r:0.020,E:2.0,Ea:45000},cu:{r:0.028,E:2.5,Ea:18000},ss:{r:0.012,E:1.8,Ea:45000},ti:{r:0.025,E:1.2,Ea:45000}},
 agit:{none:0.6,mild:1,spray:1.6},
 outputs:[
  {k:'d',label:'Etch depth',unit:'mm',pri:1},
  {k:'r',label:'Etch rate',unit:'mm/min'},
  {k:'u',label:'Undercut (per side)',unit:'mm'},
  {k:'top',label:'Opening width at surface',unit:'mm'},

  {k:'t1',label:'Time for 1 mm depth',unit:'min'},
 ],
 sweep:{x:'T',y:'d'},
 compute(p){
  const s=this.sys[p.sys], Ea=s.Ea, Rg=8.314;
  const r=s.r*this.agit[p.ag]*Math.exp(-Ea/Rg*(1/(p.T+273.15)-1/(323.15)));
  const d=r*p.time;
  const E=s.E*(p.ag==='spray'?1.25:1);
  const u=d/E;
  const notes=[];
  if(d>12) notes.push('Depths above about 12 mm are uncommon in chemical milling: undercut and surface roughness grow with depth.');
  if(p.T>80&&p.sys!=='al') notes.push('Etchant this hot will fume and attack maskant; rate control becomes poor.');
  if(2*u>p.w) notes.push('Undercut on both sides is larger than the opening, so the maskant edges are now overhanging and may tear.');
  return {o:{d,r,u,top:p.w+2*u,E,t1:1/r},notes};
 },
 theory:{
  principle:[
   'The part is cleaned, coated with a maskant, and the maskant is cut away (scribed, screen-printed or photo-exposed) where metal is to be removed. The part is then immersed in, or sprayed with, an etchant held at controlled temperature.',
   'The etchant attacks every exposed surface at about the same rate in all directions. So as the cavity deepens, it also eats sideways under the mask edge. This undercut is described by the etch factor.',
   'Depth is controlled by time. Many aerospace skins are chemically milled in steps, re-masking between immersions to create multi-level pockets.'
  ],
  eq:[
   {f:'<var>r</var> = <var>r</var><sub>ref</sub> · exp[ −(<var>E</var><sub>a</sub>/<var>R</var>)·(1/<var>T</var> − 1/<var>T</var><sub>ref</sub>) ]',w:'Arrhenius dependence of etch rate on temperature, T_ref = 50 °C. Reaction-controlled systems have E_a of about 40–50 kJ/mol. Diffusion-controlled spray etching (Cu in FeCl₃) shows only about 18 kJ/mol.'},
   {f:'<var>d</var> = <var>r</var> · <var>t</var>,   undercut <var>u</var> = <var>d</var> / <var>E</var><sub>f</sub>',w:'Depth grows linearly with time. Etch factor E_f = depth / undercut (some books use the reciprocal).'},
  ],
  effects:['When the surface reaction controls the rate, it roughly doubles for every 12–15 °C rise. When transport of fresh etchant controls it (spray etching of copper), the rise is much smaller: about 32–45 % over 17 °C in Chemcut\'s measurements.','Agitation or spraying refreshes etchant at the surface and improves etch factor.','Undercut scales with depth, so fine features need thin stock.','Surface roughness generally worsens with depth.'],
  apps:['Weight-reduction pockets in aircraft skins','Thin precision parts: shims, meshes, lead frames (photochemical machining)','Printed circuit boards','Decorative etching and nameplates'],
  adv:['Works on large, thin or complex areas in one go','No burrs, no stress, no tool wear','Low tooling cost'],
  lim:['Slow and depth-limited','Undercut limits sharp corners and small features','Hazardous chemicals and effluent treatment'],
  model:'<b>Simulator model.</b> Reference etch rates at 50 °C with mild agitation (mm/min): Al/NaOH 0.018, steel/FeCl₃ 0.020, Cu/FeCl₃ 0.028, SS/FeCl₃ 0.012, Ti/HF–HNO₃ 0.025. Activation energy 45 kJ/mol, except Cu/FeCl₃ at 18 kJ/mol, which was fitted to Chemcut\'s spray-etch data (see Validation). Only the Cu/FeCl₃ values are checked against measurements; the others are indicative. Agitation multipliers 0.6 / 1.0 / 1.6. Etch factors 1.2–2.5, improved by 25 % with spray.'
 },
 procedure:['Select aluminium / NaOH and a 3 mm mask opening.','Set temperature 50 °C and mild agitation.','Vary immersion time from 5 to 60 min and record depth and undercut.','Fix time at 30 min; vary temperature from 30 to 80 °C and record the etch rate.','Plot ln(rate) vs 1/T and confirm the activation energy from the slope.'],

{
 id:'ecm', abbr:'ECM', name:'Electrochemical Machining', cat:'chem',
 blurb:'Anodic dissolution by Faraday\'s law with a cathode tool that never wears.',
 facts:{energy:'Electrochemical (DC, 5–30 V, very high current)', mech:'Anodic dissolution of the workpiece', medium:'Flowing electrolyte: NaCl or NaNO₃ solution', tool:'Copper, brass or stainless-steel cathode'},
 aim:'To verify Faraday\'s law in ECM and study how voltage, feed rate and electrolyte conductivity set the equilibrium gap, current density and electrolyte temperature rise.',
 params:[

  {id:'mat',label:'Work material',type:'select',val:'fe',options:[['fe','Pure iron (Fe²⁺)'],['u10a','High-carbon tool steel U10A'],['ss','Stainless steel 304'],['ni','Nickel (Ni²⁺)'],['co','Cobalt (Co²⁺)'],['cu','Copper (Cu²⁺)'],['al','Aluminium (Al³⁺)'],['ti','Titanium (Ti⁴⁺)']]},
 ],
 mats:{fe:{M:55.85,z:2,rho:7.86,eta:0.95},u10a:{M:55.85,z:2,rho:7.83,eta:0.708},ss:{M:25.58,z:1,rho:8.0,eta:0.75,etaN:0.604},ni:{M:58.69,z:2,rho:8.90,eta:0.90},co:{M:58.93,z:2,rho:8.90,eta:0.90},cu:{M:63.55,z:2,rho:8.96,eta:0.90},al:{M:26.98,z:3,rho:2.70,eta:0.85},ti:{M:47.87,z:4,rho:4.51,eta:0.60}},
 outputs:[
  {k:'ge',label:'Equilibrium gap',unit:'mm',pri:1},
  {k:'J',label:'Current density',unit:'A/cm²'},
  {k:'I',label:'Current',unit:'A'},
  {k:'mrr',label:'MRR (= feed × area)',unit:'mm³/min'},
  {k:'mg',label:'Mass removal rate',unit:'g/min'},
  {k:'dT',label:'Electrolyte temperature rise',unit:'°C'},
  {k:'Pw',label:'Power',unit:'kW'},
  {k:'se',label:'Specific energy',unit:'J/mm³'},
  {k:'eta',label:'Current efficiency',unit:'%'},
 ],
 sweep:{x:'V',y:'ge'},
 compute(p){
  const m=this.mats[p.mat], dV=1.5;
  const Veff=Math.max(p.V-dV,0.1);
  const fs=p.f/1000/60;
  const shape=j=>{const T=[[0,0],[12.28,.814],[19.61,1.019],[27.43,1.093],[35.37,1.130],[50.68,1.183],[66.74,1.198],[83.19,1.202]];if(j>=83.19)return 1;for(let i=1;i<T.length;i++)if(j<=T[i][0]){const[a,b]=T[i-1],[c,d]=T[i];return (b+(d-b)*(j-a)/(c-a))/1.202;}return 1;};
  const base=p.el==='nano3'?(m.etaN??m.eta):m.eta;
  const gOf=eta=>eta*(m.M/1000)*p.k*Veff/(m.rho*1000*m.z*FARADAY*fs);
  let eta=base, ge=gOf(eta);
  if(p.el==='nano3'){for(let i=0;i<60;i++){const J=p.k*Veff/ge/1e4;eta=0.5*eta+0.5*base*shape(J);ge=gOf(eta);}}
  const J=p.k*Veff/ge;
  const I=J*p.A*1e-6;
  const mrr=p.f*p.A;
  const Pw=I*p.V;
  const dT=Pw/(1100*3800*p.Q/60000);
  const notes=[];
  if(ge<0.05) notes.push('Gap below about 0.05 mm: high risk of sparking and short circuit. Reduce feed or raise voltage.');
  if(ge>1) notes.push('Gap above 1 mm: dimensional control (shape replication) becomes poor.');
  if(dT>15) notes.push('Large temperature rise along the gap changes conductivity and can boil the electrolyte. Increase flow.');
  if(p.mat==='ti') notes.push('Titanium forms a passive oxide film; current efficiency is low and NaCl at high voltage is usually needed.');
  if(p.el==='nano3'&&eta<0.8*base) notes.push(`NaNO₃ at this low current density: the passive film limits dissolution, so current efficiency is only ${(eta*100).toFixed(0)} %. Stray dissolution is suppressed, which is why NaNO₃ gives better accuracy.`);
  return {o:{ge:ge*1000,J:J/1e4,I,mrr,mg:mrr*m.rho/1000,dT,Pw:Pw/1000,se:Pw/(mrr/60),eta:eta*100},notes};
 },
 theory:{
  principle:[
   'The workpiece is the anode and the shaped tool is the cathode, separated by a gap of 0.1–1 mm through which electrolyte flows at 10–30 m/s. With 5–30 V applied, current densities of 20–200 A/cm² dissolve metal atoms from the anode as ions.',
   'At the anode iron goes into solution as Fe²⁺ and forms Fe(OH)₂ sludge with hydroxyl ions. At the cathode only hydrogen gas is evolved, so the tool does not wear.',
   'When the tool is fed at a constant rate, the gap settles to an equilibrium where the dissolution rate exactly equals the feed. The work then replicates the tool shape, offset by this gap.'
  ],
  eq:[
   {f:'MRR (mass) = η · <var>I</var> · <var>M</var> / ( <var>z</var> · <var>F</var> )',w:'Faraday\'s law: M atomic mass, z valence, F = 96 485 C/mol, η current efficiency.'},
   {f:'<var>I</var> = κ · (<var>V</var> − Δ<var>V</var>) · <var>A</var> / <var>g</var>',w:'Ohm\'s law across the gap; ΔV ≈ 1.5 V of electrode over-potential.'},
   {f:'<var>g</var><sub>e</sub> = η <var>M</var> κ (<var>V</var> − Δ<var>V</var>) / ( ρ <var>z</var> <var>F</var> <var>f</var> )',w:'Equilibrium gap when the dissolution velocity equals the feed rate f.'},
  ],
  effects:['At equilibrium, MRR = feed × area; voltage and conductivity only change the gap.','Higher voltage or conductivity widens the gap; faster feed narrows it.','Current and heating rise with feed; electrolyte flow must remove heat and sludge.','Passive metals (Ti) have low current efficiency.'],
  apps:['Turbine blades and blisks in nickel superalloys','Deep small holes (STEM, electro-stream drilling)','Gun-barrel rifling','Deburring of intersecting holes'],
  adv:['No tool wear; stress-free, burr-free surfaces','MRR independent of material hardness','Good finish (Ra 0.1–2.5 µm) even at high MRR'],
  lim:['High capital cost, very large currents','Corrosive electrolyte and sludge disposal','Sharp corners hard to reproduce; tool design is iterative','Only conductive work'],
  model:'<b>Simulator model.</b> Faraday + Ohm model with ΔV = 1.5 V and constant conductivity along the gap. Current efficiencies: tool steel U10A in 10 % NaCl 70.8 % (measured, Yanpolskiy et al.). SS304 in NaNO₃ follows the measured efficiency–current-density curve of Lee et al. (Appl. Sci. 2021), plateau 1.20 mm³/A·min ≈ 60 % of the Cr³⁺ Faraday value. For other metals in NaNO₃ the same curve shape is assumed. Other efficiencies are typical textbook values. The equilibrium gap is solved iteratively, because efficiency depends on current density. Temperature rise assumes electrolyte density 1100 kg/m³ and specific heat 3800 J/kg·K with all electrical power going into the electrolyte (an upper bound).'
 },
 procedure:['Select iron/steel work, κ = 15 S/m and a 500 mm² tool.','Set feed 1 mm/min and vary voltage from 5 to 30 V; record gap and current.','Fix voltage at 15 V and vary feed from 0.2 to 4 mm/min; record gap and current.','Confirm MRR = feed × area and compare with Faraday\'s law using the recorded current.','Change the electrolyte flow and note the temperature rise.'],
 quiz:[

 compute(p){

  apps:['Injection-mould and die cavities in hardened steel','Deep ribs and slots','Machining of carbide and superalloys','Small holes (EDM drilling) for cooling channels'],
  adv:['Any conductive material regardless of hardness','Complex 3D cavities; no cutting forces','Good accuracy; can finish to Ra < 0.5 µm'],

  model:'<b>Simulator model.</b> V_d = 25 V. Removal efficiency η = 0.12·tₒₙ/(tₒₙ + 10)·exp(−tₒₙ/800), giving about 10–14 mm³/min per ampere in steel roughing, which matches the common rule of thumb. Ra = 0.65·Iₚ^0.4·tₒₙ^0.2, overcut = 0.01 + 0.03·E^(1/3) mm, recast = 1.2·√E µm, and tool wear ratio = base × √(50/tₒₙ) are empirical fits of typical published trends.'
 },

 ],
 lasers:{fiber:{lam:1.07e-6,M2:1.1,D:0.012},co2:{lam:10.6e-6,M2:1.2,D:0.020},yag:{lam:1.064e-6,M2:15,D:0.012}},
 coup:{fiber:{steel:.09,ss:.09,al:.05,ti:.09,pmma:.01,ply:.06},co2:{steel:.10,ss:.10,al:.03,ti:.10,pmma:.20,ply:.15},yag:{steel:.08,ss:.08,al:.045,ti:.08,pmma:.01,ply:.06}},
 es:{steel:null,ss:null,al:null,ti:null,pmma:2.2,ply:4.0},
 alpha:{steel:1.2e-5,ss:4e-6,al:6.4e-5,ti:2.9e-6,pmma:1.1e-7,ply:1.5e-7},
 outputs:[

 sweep:{x:'t',y:'u'},
 compute(p){
  const L=this.lasers[p.las];
  const F=0.127;
  const d0=4*L.M2*L.lam*F/(Math.PI*L.D);
  const I=p.P/(Math.PI*d0*d0/4)/1e4/1e6;
  const metal=['steel','ss','al','ti'].includes(p.mat);
  const es=metal?eMelt(TH[p.mat]):this.es[p.mat];
  const kerf=1.3*d0*1000+0.02*p.t+0.05;

      let g=1; if(p.gas==='air') g={steel:1.15,ss:1.05,ti:1.2,al:1.0}[p.mat]; if(p.gas==='o2') g={ss:1.2,ti:1.6,al:1.0}[p.mat];

    u=k*p.P/(p.t*kerf*es)*0.06;

  {k:'n',label:'Pulses per hole',unit:''},
  {k:'del',label:'Electron range',unit:'µm'},

 sweep:{x:'I',y:'th'},
 compute(p){
  const m=TH[p.mat];
  const Pk=p.V*1e3*p.I*1e-3;
  const Ep=Pk*p.tp*1e-6;
  const ev=eVap(m);
  const vpp=0.15*Ep/ev;
  const holeV=Math.PI/4*Math.pow(p.ds/1000,2)*p.t;
  const n=Math.ceil(holeV/vpp);
  const pd=Pk/(Math.PI/4*Math.pow(p.ds*1e-4,2))/1e6;
  const del=2.2e-12*Math.pow(p.V*1e3,2)/(m.rho/1000)*1e4;
  const g=1+p.V*1e3/511e3, beta=Math.sqrt(1-1/(g*g));
  const notes=[];
  if(p.tp*1e-6*p.fr>0.5) notes.push('Duty cycle above 50 %: heat builds up between pulses, enlarging the melt zone and HAZ.');
  if(p.t*1000/p.ds>15) notes.push('Aspect ratio above ~15:1 is difficult; vapour pressure may not expel melt from deep holes.');
  if(pd<0.1) notes.push('Power density below ~10⁵ W/cm²: the beam melts rather than vaporises, giving poor hole quality.');
  return {o:{th:n/p.fr,mrr:vpp*p.fr*60,Pk:Pk/1000,pd,Ep,n,del,beta},notes};
 },

  {id:'mat',label:'Work material',type:'select',val:'steel',options:[['steel','Mild steel'],['ss','Stainless steel'],['al','Aluminium']]},
 ],
 outputs:[
  {k:'u',label:'Cutting speed',unit:'mm/min',pri:1},
  {k:'V',label:'Arc voltage',unit:'V'},
  {k:'P',label:'Arc power',unit:'kW'},
  {k:'kerf',label:'Kerf width',unit:'mm'},
  {k:'le',label:'Energy per metre of cut',unit:'MJ/m'},
  {k:'pierce',label:'Pierce capacity (rule of thumb)',unit:'mm'},
 ],
 sweep:{x:'t',y:'u'},
 compute(p){
  const V=100+0.4*p.I+0.9*p.t+(p.gas==='arh'?20:0);
  const P=V*p.I;
  const gas={air:{steel:1.2,ss:1.0,al:1.0},o2:{steel:1.35,ss:0.9,al:0.9},n2:{steel:1.0,ss:1.05,al:1.05},arh:{steel:0.95,ss:1.15,al:1.2}}[p.gas][p.mat];
  const es={steel:eMelt(TH.steel),ss:eMelt(TH.ss),al:eMelt(TH.al)*2.0}[p.mat];
  const kerf=0.8+0.0075*p.I+0.03*p.t;
  const raw=0.3423*gas*P*Math.exp(-p.t/(0.371*p.I))/(p.t*kerf*es)*60;
  const capped=raw>9000;
  const us=Math.min(raw,9000)/60;
  const notes=[];
  if(capped) notes.push('Speed limited to 9 m/min, the practical ceiling in Hypertherm\'s charts. Thin sheet at low current cannot be cut faster without losing arc stability.');
  if(p.t>0.18*p.I) notes.push('Thickness exceeds the rule-of-thumb pierce capacity for this current; start from an edge.');
  if(us*60<250) notes.push('Very slow cutting: heavy bottom dross and a wide, bevelled kerf are expected.');
  if(p.gas==='o2'&&p.mat!=='steel') notes.push('Oxygen is used for carbon steel only; on SS and Al it gives a rough, oxidised edge.');
  if(p.gas==='arh'&&p.mat==='steel') notes.push('Ar–H₂ is normally reserved for thick stainless and aluminium.');
  return {o:{u:us*60,V,P:P/1000,kerf,le:P/us/1000,pierce:0.18*p.I},notes};
 },

let Ccache=null, Ctime=0;
function getC(now){if(!Ccache||now-Ctime>1000){Ccache=colors();Ctime=now;}return Ccache;}

// ---------- generic XY plot ----------
const tf=v=>{const a=Math.abs(v);return a>=10000?Math.round(v).toLocaleString('en-IN'):String(+v.toPrecision(6));};
function nice(lo,hi,n=5){const span=hi-lo||Math.abs(hi)||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const r=step0/mag;const step=(r<1.5?1:r<3?2:r<7?5:10)*mag;
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const t=[];for(let v=a;v<=b+step*0.5;v+=step)t.push(+v.toPrecision(12));return {a,b,t};}
const PAL=['--mech','--therm','--chem','--spark','--muted'];
function plotXY(cv,o){
  if(!cv)return;if(!cv._dpr)sizeCanvas(cv);const c=cv.getContext('2d');const C=getC(performance.now());
  const W=cv.width/cv._dpr,H=cv.height/cv._dpr;c.setTransform(cv._dpr,0,0,cv._dpr,0,0);c.clearRect(0,0,W,H);
  const allY=[];o.series.forEach(s=>s.ys.forEach(y=>isFinite(y)&&allY.push(y)));(o.points||[]).forEach(p=>isFinite(p.y)&&allY.push(p.y));
  if(!allY.length)return;
  let ylo=Math.min(0,...allY),yhi=Math.max(...allY)*1.04;if(yhi===ylo)yhi=ylo+1;
  const Y=nice(ylo,yhi),X=nice(o.xmin,o.xmax,6);
  const L=60,R=14,Tp=14,B=40;const px=x=>L+(x-X.a)/(X.b-X.a)*(W-L-R);const py=y=>H-B-(y-Y.a)/(Y.b-Y.a)*(H-Tp-B);
  c.font='11px "JetBrains Mono", monospace';c.fillStyle=C.muted;c.strokeStyle=C.line;c.lineWidth=1;
  Y.t.forEach(v=>{const y=Math.round(py(v))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();c.textAlign='right';c.textBaseline='middle';c.fillText(tf(v),L-6,y);});
  X.t.forEach(v=>{if(v<X.a-1e-9||v>X.b+1e-9)return;const x=Math.round(px(v))+.5;c.beginPath();c.moveTo(x,H-B);c.lineTo(x,H-B+4);c.stroke();c.textAlign='center';c.textBaseline='top';c.fillText(tf(v),x,H-B+7);});
  c.strokeStyle=C.ink;c.beginPath();c.moveTo(L,H-B+.5);c.lineTo(W-R,H-B+.5);c.stroke();
  c.textAlign='center';c.fillStyle=C.muted;c.fillText(o.xlabel,(L+W-R)/2,H-16);
  c.save();c.translate(12,(Tp+H-B)/2);c.rotate(-Math.PI/2);c.textAlign='center';c.textBaseline='middle';c.fillText(o.ylabel,0,0);c.restore();
  c.save();c.beginPath();c.rect(L,Tp-4,W-L-R,H-B-Tp+4);c.clip();
  o.series.forEach(s=>{const col=s.color;c.beginPath();let st=false;s.xs.forEach((x,i)=>{if(!isFinite(s.ys[i])){st=false;return;}const X1=px(x),Y1=py(s.ys[i]);st?c.lineTo(X1,Y1):c.moveTo(X1,Y1);st=true;});
    if(s.fill){const path=new Path2D();let first=true;s.xs.forEach((x,i)=>{if(!isFinite(s.ys[i]))return;first?path.moveTo(px(x),py(s.ys[i])):path.lineTo(px(x),py(s.ys[i]));first=false;});path.lineTo(px(s.xs[s.xs.length-1]),py(Math.max(Y.a,0)));path.lineTo(px(s.xs[0]),py(Math.max(Y.a,0)));path.closePath();c.globalAlpha=0.10;c.fillStyle=col;c.fill(path);c.globalAlpha=1;}
    c.setLineDash(s.dash||[]);c.strokeStyle=col;c.lineWidth=s.width||2;c.stroke();c.setLineDash([]);});
  (o.points||[]).forEach(p=>{c.fillStyle=p.fill||C.panel;c.strokeStyle=p.color;c.lineWidth=1.8;c.beginPath();
    if(p.shape==='sq'){c.rect(px(p.x)-4,py(p.y)-4,8,8);}else c.arc(px(p.x),py(p.y),p.r||4.5,0,7);c.fill();c.stroke();});
  c.restore();
  if(o.marker&&isFinite(o.marker.y)){const m=o.marker;c.fillStyle=C.panel;c.strokeStyle=m.color;c.lineWidth=2;c.beginPath();c.arc(px(m.x),py(m.y),5,0,7);c.fill();c.stroke();
    c.fillStyle=C.ink;const right=px(m.x)>W*0.7;c.textAlign=right?'right':'left';c.textBaseline='bottom';c.fillText(m.text,px(m.x)+(right?-9:9),py(m.y)-6);}
}
function curve(P,base,xId,yId,lo,hi){const ss=sweepSel[P.id];xId=xId||ss.x;yId=yId||ss.y;const q=P.params.find(x=>x.id===xId);lo=lo??q.min;hi=hi??q.max;
  const b={...base};const xs=[],ys=[];for(let i=0;i<=60;i++){const x=lo+(hi-lo)*i/60;b[xId]=x;const y=P.compute(b).o[yId];xs.push(x);ys.push(isFinite(y)?y:NaN);}return {xs,ys};}
function drawChart(P,cvOverride){
  const cv=cvOverride||$('#chart');if(!cv)return;
  const ss=sweepSel[P.id];const q=P.params.find(x=>x.id===ss.x);const o=P.outputs.find(x=>x.k===ss.y);
  const accent=getComputedStyle(document.querySelector('article')||document.documentElement).getPropertyValue('--c').trim()||tok('--accent');
  const series=held[P.id].map((h,i)=>({xs:h.xs,ys:h.ys,color:tok(PAL[i%PAL.length]),width:1.6,dash:[5,4]}));
  const cur=curve(P,state[P.id]);series.push({...cur,color:accent,fill:held[P.id].length===0,width:2.2});
  const cy=P.compute(state[P.id]).o[o.k];
  plotXY(cv,{xmin:q.min,xmax:q.max,xlabel:`${q.label} (${q.unit})`,ylabel:`${o.label}${o.unit?' ('+o.unit+')':''}`,series,marker:{x:state[P.id][q.id],y:cy,color:accent,text:`${fmt(cy)} ${o.unit}`}});
  const lg=$('#legend');if(lg&&!cvOverride)lg.innerHTML=held[P.id].length?held[P.id].map((h,i)=>`<span><i style="border-color:var(${PAL[i%PAL.length]})"></i>${esc(h.label)}</span>`).join('')+`<span><i style="border-color:${accent};border-top-style:solid"></i>Current: ${esc(diffLabel(P))}</span>`:'';
}

    h+=`<div class="card"><h3>Published speeds vs model quality band</h3><p class="foot" style="margin-top:0">${esc(b.name)}. ${inside} of ${b.rows.length} inside.</p><div class="tablewrap" style="max-height:none"><table class="cmp"><thead><tr><th>Thickness (mm)</th><th class="n">Published (mm/min)</th><th class="n">Model Q5–Q1 (mm/min)</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div><p class="foot">Source: ${srcRef(b.src)}</p></div>`;}

// ---------- tests ----------
function renderTest(P,kind){
  const Q=kind==='pre'?(PRE[P.id]||[]):P.quiz;const qs=tests[P.id][kind];
  const n=Q.length, ans=Object.keys(qs).length, right=Object.entries(qs).filter(([i,v])=>Q[i]&&Q[i].a===v).length;
  $('#pane').innerHTML=`<div class="quiz"><p class="aim">${kind==='pre'?'<b>Pre-test.</b> Check the ideas you need before the experiment. Your score goes into the lab report.':'<b>Post-test.</b> Answer after completing the experiment and numericals. Your score goes into the lab report.'}</p>
  <div class="score"><span>${ans} of ${n} answered · ${right} correct</span>${ans?'<button class="iconbtn" id="qreset" type="button">Start again</button>':''}</div>
  ${Q.map((q,i)=>`<div class="q"><p>${i+1}. ${q.q}</p><div class="opts">${q.o.map((o,j)=>{let cls='';if(i in qs){if(j===q.a)cls='right';else if(j===qs[i])cls='wrong';}return `<button type="button" class="${cls}" data-q="${i}" data-o="${j}" ${i in qs?'aria-disabled="true"':''}>${o}</button>`;}).join('')}</div>
  ${i in qs?`<div class="why"><b>${qs[i]===q.a?'Correct.':'Not quite.'}</b> ${q.why}</div>`:''}</div>`).join('')}
  ${ans===n?`<div class="btnrow"><button class="btn" type="button" id="next">${kind==='pre'?'Go to the experiment':'Go to the report'}</button></div>`:''}</div>`;
  $('#pane').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q;if(i in qs)return;qs[i]=+b.dataset.o;save();renderTest(P,kind);});
  const r=$('#qreset');if(r)r.onclick=()=>{tests[P.id][kind]={};save();renderTest(P,kind);};
  const nx=$('#next');if(nx)nx.onclick=()=>{tabOf[P.id]=kind==='pre'?'op':'rep';renderPane(P);window.scrollTo(0,0);};
}
function score(P,kind){const Q=kind==='pre'?(PRE[P.id]||[]):P.quiz;const qs=tests[P.id][kind];const a=Object.keys(qs).length;return {a,n:Q.length,r:Object.entries(qs).filter(([i,v])=>Q[i]&&Q[i].a===v).length};}

// ---------- numericals ----------
function renderNum(P){
  const S=numS[P.id]||(numS[P.id]={cur:NUM[P.id](),done:false,tried:0,solved:0,attempted:0});
  const c=S.cur;
  $('#pane').innerHTML=`<div class="quiz"><p class="aim"><b>Numerical problems.</b> Each problem uses fresh random values. Answers within ±2 % are accepted.</p>
  <div class="score"><span>This session: ${S.solved} solved of ${S.attempted} attempted</span></div>
  <div class="card numcard"><p class="numq">${c.q}</p>
  <form id="nform" class="numrow" onsubmit="return false"><label for="nans" class="sr">Your answer in ${c.unit}</label><input id="nans" inputmode="decimal" autocomplete="off" placeholder="Your answer" ${S.done?'disabled':''}><span class="mono">${c.unit}</span>
  <button class="btn" type="submit" ${S.done?'disabled':''}>Check</button><button class="btn ghost" type="button" id="nshow">${S.done?'New problem':'Show solution'}</button></form>
  <div id="nfb" aria-live="polite">${S.done?S.fb:''}</div></div></div>`;
  const sol=`<div class="why"><b>Solution.</b> ${c.sol}</div>`;
  $('#nform').onsubmit=()=>{const v=parseFloat($('#nans').value.replace(/,/g,''));if(!isFinite(v)){$('#nfb').innerHTML='<div class="why">Enter a number.</div>';return false;}
    S.tried++;const ok=Math.abs(v/c.ans-1)<=0.02;
    if(ok){S.solved++;S.attempted++;S.done=true;S.fb=`<div class="why"><b class="ok">Correct.</b> Exact answer ${fmt(c.ans)} ${c.unit}.</div>`+sol;renderNum(P);}
    else{$('#nfb').innerHTML=`<div class="why"><b class="bad">Not yet.</b> Your answer is ${((v/c.ans-1)*100).toFixed(0)} % ${v>c.ans?'high':'low'}. Check units and try again, or show the solution.</div>`;}
    return false;};
  $('#nshow').onclick=()=>{if(S.done){numS[P.id]={cur:NUM[P.id](),done:false,tried:0,solved:S.solved,attempted:S.attempted};renderNum(P);return;}
    S.attempted++;S.done=true;S.fb=`<div class="why">Answer: <b>${fmt(c.ans)} ${c.unit}</b>.</div>`+sol;renderNum(P);};
}

// ---------- operate engine ----------
const runlog={};PROCESSES.forEach(P=>runlog[P.id]=[]);
(function(){const s=store.get('ntm-lab-v2');if(s&&s.runlog)for(const k in s.runlog)if(runlog[k])runlog[k]=s.runlog[k];})();
const saveAll=()=>store.set('ntm-lab-v2',{state,records,mine,tests,report,runlog});
let OP=null;
const TOP=['work','tool','fluid'];
function opNew(pid){return {pid,f:{work:0,tool:0,fluid:0,on:0,prog:0,x:{}},ramps:{},phase:'setup',alarm:'',tA:0,t0:0,dur:7000,meas:null,drag:null,last:0};}
const has=(f,id)=>TOP.includes(id)?!!f[id]:!!f.x[id];
function setF(f,id,v){if(TOP.includes(id))f[id]=v?1:0;else f.x[id]=v?1:0;}
function opItems(O){const items=[...O.parts.map(x=>({...x,kind:'part'})),...O.switches.map(x=>({...x,kind:'sw'}))];
  const seq=[],av=new Set();let guard=0;while(seq.length<items.length&&guard++<50){const it=items.find(i=>!seq.includes(i)&&(i.req||[]).every(r=>av.has(r)));if(!it){items.filter(i=>!seq.includes(i)).forEach(i=>seq.push(i));break;}seq.push(it);av.add(it.id);}return seq;}
function opDerive(P){const f=OP.f,p=state[P.id];
  if(P.id==='chm'){const r=f.x.heatR??(f.x.heat?1:0);f.x.temp=25+(p.T-25)*r;}
  if(P.id==='edm'){f.x.level=f.x.fluidR??(f.fluid?1:0);}
  if(P.id==='ajm'){f.x.airR=f.x.airR??(f.x.air?1:0);}
  if(P.id==='wjm'||P.id==='awjm'){f.x.fluidR=f.x.fluidR??(f.fluid?1:0);}
  if(P.id==='ebm'){const v=f.x.fluidR??(f.fluid?1:0);f.x.vac=v;if(v<=0)f.x.vacTxt='1 atm';else{const torr=760*Math.pow(10,-v*7.88);const e=Math.floor(Math.log10(torr));f.x.vacTxt=`${(torr/Math.pow(10,e)).toFixed(1)}×10${String(e).replace('-','⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d])} torr`;}}
}
function opAlarm(msg){OP.alarm=msg;const a=$('#oalarm');if(a){a.hidden=!msg;a.innerHTML=msg?`<b>Alarm.</b> ${msg}`:'';}}
function opPlace(P,partId){const O=OPS[P.id],pt=O.parts.find(x=>x.id===partId);if(!pt||OP.phase==='run')return;
  if(has(OP.f,partId)){return;}
  const miss=(pt.req||[]).filter(r=>!has(OP.f,r));
  if(miss.length){opAlarm(pt.alarm||'Complete the earlier steps first.');return;}
  setF(OP.f,partId,1);opAlarm('');opUI(P);}
function opSwitch(P,id){const O=OPS[P.id],sw=O.switches.find(x=>x.id===id);if(!sw||OP.phase==='run')return;
  const on=has(OP.f,id)||OP.ramps[id];
  if(on){ // switch off + cascade dependants
    const off=id2=>{setF(OP.f,id2,0);delete OP.ramps[id2];delete OP.f.x[id2+'R'];O.switches.filter(s=>(s.req||[]).includes(id2)&&has(OP.f,s.id)).forEach(s=>off(s.id));};off(id);opAlarm('');opDerive(P);opUI(P);return;}
  const miss=(sw.req||[]).filter(r=>!has(OP.f,r));
  if(miss.length){opAlarm(sw.alarm||'Complete the earlier steps first.');return;}
  opAlarm('');
  if(sw.ramp){OP.ramps[id]={t0:performance.now(),dur:(reduce?0.3:sw.ramp)*1000};OP.f.x[id+'R']=0;}else setF(OP.f,id,1);
  opDerive(P);opUI(P);}
function opStart(P){const O=OPS[P.id];if(OP.phase==='run')return;
  const items=opItems(O);const miss=items.find(i=>!has(OP.f,i.id));
  if(miss){opAlarm(`Machine not ready: ${miss.kind==='part'?'place the '+miss.label.toLowerCase():'switch on '+miss.label.toLowerCase()} first.`);return;}
  const r=P.compute(state[P.id]);if(!(r.o&&isFinite(Object.values(r.o)[0]))){opAlarm('These settings give no valid result. Change them and try again.');return;}
  opAlarm('');OP.phase='run';OP.f.on=1;OP.f.prog=0;OP.t0=performance.now();OP.dur=reduce?1500:7000;OP.meas=null;opUI(P);}
function opStop(P){if(OP.phase!=='run')return;OP.phase='setup';OP.f.on=0;opAlarm('Emergency stop pressed. The cycle was aborted; reset and run again.');OP.f.prog=0;opUI(P);}
function opFinish(P){const O=OPS[P.id];OP.phase='done';OP.f.on=0;OP.f.prog=1;const o=P.compute(state[P.id]).o;OP.meas={...O.meas(state[P.id],o),settings:diffLabel(P),solved:false,shown:false};opUI(P);
  const m=$('#omeas');if(m)m.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});}
function opReset(P){OP=opNew(P.id);opDerive(P);opUI(P);}

function opUI(P){if(!$('#ocv'))return;const O=OPS[P.id],f=OP.f;

function opGauges(P){const el=$('#ogauges');if(!el)return;const o=P.compute(state[P.id]).o;

function opLog(P){const el=$('#olog');if(!el)return;const L=runlog[P.id];
  el.innerHTML=L.length?`<table><thead><tr><th>Run</th><th>Settings</th><th>Readings</th><th>Your answer</th><th>Correct</th><th>Model</th></tr></thead><tbody>${L.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.settings)}</td><td style="white-space:normal;min-width:220px">${r.readings.map(x=>esc(x.join(': '))).join('<br>')}</td><td>${r.student==null?'shown':fmt(r.student)}</td><td>${fmt(r.ans)} ${r.unit}</td><td>${fmt(r.model)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Each completed cycle adds a row here and to your lab report.</div>';}
function opTick(P,now){if(!OP||OP.pid!==P.id)return;const dt=Math.min(0.05,(now-(OP.last||now))/1000);OP.last=now;let ch=false;
  for(const id in OP.ramps){const r=OP.ramps[id];const k=Math.min(1,(now-r.t0)/r.dur);OP.f.x[id+'R']=k;if(k>=1){delete OP.ramps[id];delete OP.f.x[id+'R'];setF(OP.f,id,1);ch=true;}}
